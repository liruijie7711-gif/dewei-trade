<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dewei — 物流报价工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #f8f9fb; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Dewei</h1>
            <p class="text-gray-500 mt-2 text-sm">外贸助手 · 物流报价工具</p>
        </div>
        <div style="background:#fff; border-radius:12px; border:1px solid #e8ecf1; padding:32px;">
            <form method="POST">
                <label class="block text-sm font-medium text-gray-600 mb-1.5">请输入密码</label>
                <input type="password" name="password" class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm outline-none focus:border-blue-500" placeholder="输入密码" autofocus>
                {% if error %}<p class="text-red-500 text-xs mt-2">密码错误，请重试</p>{% endif %}
                <button type="submit" class="w-full mt-4 py-3 rounded-lg text-white font-semibold text-sm" style="background:#3b5de7;">登录</button>
            </form>
        </div>
    </div>
</body>
</html>
